# Sponsor button configuration.
# Only GitHub Sponsors is enabled: https://github.com/sponsors/sid200ok
# Every other platform is left commented out on purpose. Enabling a platform
# without a real account renders a broken link in the Sponsor dialog.
# To enable another later, uncomment it and put a REAL username, then commit.

github: [sid200ok]

# patreon: # single Patreon username
# open_collective: # single Open Collective username
# ko_fi: # single Ko-fi username
